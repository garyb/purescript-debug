name: CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.4"

      - uses: actions/setup-node@v1
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build source
        run: npm run-script build

      - name: Run tests
        run: npm run-script test --if-present
